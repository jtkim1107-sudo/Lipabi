<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lipabi — AI 분석 칸반보드</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <div class="header-left">
      <h1>Lipabi</h1>
      <span class="subtitle">Power BI · AI 아침 분석 · 팀 칸반보드</span>
    </div>
    <div class="header-right">
      <button id="run-btn" class="btn-primary">지금 분석 실행</button>
      <span id="user-name" class="user-name"></span>
      <button id="manage-users-btn" class="btn-ghost hidden">직원 관리</button>
      <button id="logout-btn" class="btn-ghost">로그아웃</button>
    </div>
  </header>

  <section id="report-panel" class="report-panel hidden">
    <div class="report-header">
      <h2>오늘의 AI 분석<span id="report-date"></span></h2>
      <button id="toggle-report" class="btn-ghost">접기</button>
    </div>
    <div id="report-body">
      <p id="report-summary"></p>
      <ul id="report-insights"></ul>
      <p id="report-notes" class="report-notes"></p>
    </div>
  </section>

  <main class="board">
    <div class="column" data-status="suggested">
      <div class="column-header">
        <h3>AI 제안</h3><span class="count"></span>
      </div>
      <div class="cards" data-status="suggested"></div>
    </div>
    <div class="column" data-status="todo">
      <div class="column-header">
        <h3>할 일</h3><span class="count"></span>
        <button class="btn-add" id="add-task-btn" title="업무 추가">＋</button>
      </div>
      <div class="cards" data-status="todo"></div>
    </div>
    <div class="column" data-status="in_progress">
      <div class="column-header">
        <h3>진행 중</h3><span class="count"></span>
      </div>
      <div class="cards" data-status="in_progress"></div>
    </div>
    <div class="column" data-status="done">
      <div class="column-header">
        <h3>완료</h3><span class="count"></span>
      </div>
      <div class="cards" data-status="done"></div>
    </div>
  </main>

  <div id="users-modal" class="modal-backdrop hidden">
    <div class="modal">
      <div class="modal-header">
        <h2>직원 관리</h2>
        <button id="close-users-modal" class="btn-ghost">닫기</button>
      </div>
      <table class="users-table">
        <thead><tr><th>아이디</th><th>이름</th><th>역할</th><th></th></tr></thead>
        <tbody id="users-tbody"></tbody>
      </table>
      <form id="add-user-form" class="add-user-form">
        <input type="text" id="new-username" placeholder="아이디" required>
        <input type="text" id="new-name" placeholder="이름" required>
        <input type="password" id="new-password" placeholder="비밀번호 (8자 이상)" minlength="8" required>
        <select id="new-role">
          <option value="member">직원</option>
          <option value="admin">관리자</option>
        </select>
        <button type="submit" class="btn-primary">추가</button>
      </form>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>
  <script src="/static/app.js"></script>
</body>
</html>
