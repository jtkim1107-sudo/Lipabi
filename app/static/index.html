<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lipabi — AI 분석 칸반보드</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <div class="header-left">
      <h1>Lipabi</h1>
      <span class="subtitle">Power BI · AI 아침 분석 · 팀 칸반보드</span>
    </div>
    <div class="header-right">
      <button id="run-btn" class="btn-primary">지금 분석 실행</button>
      <span id="user-name" class="user-name"></span>
      <button id="briefing-btn" class="btn-ghost">오늘 브리핑</button>
      <button id="my-agent-btn" class="btn-ghost">내 에이전트</button>
      <button id="agent-btn" class="btn-ghost hidden">내 분석가</button>
      <button id="manage-users-btn" class="btn-ghost hidden">직원 관리</button>
      <button id="logout-btn" class="btn-ghost">로그아웃</button>
    </div>
  </header>

  <section id="report-panel" class="report-panel hidden">
    <div class="report-header">
      <h2>오늘의 AI 분석<span id="report-date"></span></h2>
      <button id="toggle-report" class="btn-ghost">접기</button>
    </div>
    <div id="report-body">
      <p id="report-summary"></p>
      <ul id="report-insights"></ul>
      <p id="report-notes" class="report-notes"></p>
      <div class="report-feedback">
        <span>이 분석이 도움됐나요?</span>
        <button id="fb-good" class="btn-ghost">👍 좋아요</button>
        <button id="fb-bad" class="btn-ghost">👎 아쉬워요</button>
      </div>
    </div>
  </section>

  <main class="board">
    <div class="column" data-status="suggested">
      <div class="column-header">
        <h3>AI 제안</h3><span class="count"></span>
      </div>
      <div class="cards" data-status="suggested"></div>
    </div>
    <div class="column" data-status="todo">
      <div class="column-header">
        <h3>할 일</h3><span class="count"></span>
        <button class="btn-add" id="add-task-btn" title="업무 추가">＋</button>
      </div>
      <div class="cards" data-status="todo"></div>
    </div>
    <div class="column" data-status="in_progress">
      <div class="column-header">
        <h3>진행 중</h3><span class="count"></span>
      </div>
      <div class="cards" data-status="in_progress"></div>
    </div>
    <div class="column" data-status="done">
      <div class="column-header">
        <h3>완료</h3><span class="count"></span>
      </div>
      <div class="cards" data-status="done"></div>
    </div>
  </main>

  <div id="users-modal" class="modal-backdrop hidden">
    <div class="modal">
      <div class="modal-header">
        <h2>직원 관리</h2>
        <button id="close-users-modal" class="btn-ghost">닫기</button>
      </div>
      <table class="users-table">
        <thead><tr><th>아이디</th><th>이름</th><th>팀</th><th>역할</th><th></th></tr></thead>
        <tbody id="users-tbody"></tbody>
      </table>
      <form id="add-user-form" class="add-user-form">
        <input type="text" id="new-username" placeholder="아이디" required>
        <input type="text" id="new-name" placeholder="이름" required>
        <input type="text" id="new-team" placeholder="팀 (예: 마케팅)">
        <input type="password" id="new-password" placeholder="비밀번호 (8자 이상)" minlength="8" required>
        <select id="new-role">
          <option value="member">직원</option>
          <option value="leader">팀장</option>
          <option value="admin">관리자</option>
        </select>
        <button type="submit" class="btn-primary">추가</button>
      </form>
    </div>
  </div>

  <div id="agent-modal" class="modal-backdrop hidden">
    <div class="modal">
      <div class="modal-header">
        <h2>내 분석가 교육</h2>
        <button id="close-agent-modal" class="btn-ghost">닫기</button>
      </div>
      <label class="field-label" for="agent-name">이름</label>
      <input type="text" id="agent-name" class="field-input" placeholder="예: 리파비 수석 분석가">
      <label class="field-label" for="agent-instructions">나의 지침 — 분석가가 따라야 할 나의 관점과 기준</label>
      <textarea id="agent-instructions" class="field-textarea" rows="8"
        placeholder="예)
- 우리 회사는 재고 회전율을 매출보다 중요하게 본다
- 업무 지시는 담당 팀(영업/재고/마케팅)을 명시할 것
- 광고비 관련 제안은 주 단위 예산 한도를 넘지 않는 선에서만
- 말투는 간결하게, 숫자는 반드시 전주 대비 %로"></textarea>
      <div class="agent-actions">
        <button id="save-agent-btn" class="btn-primary">저장</button>
        <button id="train-agent-btn" class="btn-primary">피드백 학습하기 (<span id="pending-fb">0</span>건 대기)</button>
      </div>
      <label class="field-label">학습된 교훈 — 피드백에서 자동으로 정리됩니다</label>
      <pre id="agent-lessons" class="lessons-box">(아직 학습된 교훈이 없습니다)</pre>
      <p id="train-changelog" class="train-changelog hidden"></p>
    </div>
  </div>

  <div id="my-agent-modal" class="modal-backdrop hidden">
    <div class="modal">
      <div class="modal-header">
        <h2>내 에이전트</h2>
        <button id="close-my-agent-modal" class="btn-ghost">닫기</button>
      </div>
      <label class="field-label" for="my-agent-name">이름</label>
      <input type="text" id="my-agent-name" class="field-input" placeholder="예: 김대리의 비서">
      <label class="field-label" for="my-agent-instructions">나에 대해 — 역할, 선호, 일하는 방식</label>
      <textarea id="my-agent-instructions" class="field-textarea" rows="7"
        placeholder="예)
- 나는 마케팅 담당, 광고/프로모션 업무를 우선 맡는다
- 오전에는 집중 업무, 회의성 업무는 오후로
- 재무 관련 업무는 내 담당이 아님
- 브리핑은 짧고 실행 위주로"></textarea>
      <div class="agent-actions">
        <button id="save-my-agent-btn" class="btn-primary">저장</button>
        <button id="train-my-agent-btn" class="btn-primary">피드백 학습하기 (<span id="my-pending-fb">0</span>건 대기)</button>
      </div>
      <label class="field-label">나에 대해 학습한 내용 — 내 행동과 피드백에서 자동 정리</label>
      <pre id="my-agent-lessons" class="lessons-box">(아직 학습된 내용이 없습니다)</pre>
      <p id="my-train-changelog" class="train-changelog hidden"></p>
    </div>
  </div>

  <div id="briefing-modal" class="modal-backdrop hidden">
    <div class="modal">
      <div class="modal-header">
        <h2 id="briefing-title">오늘 브리핑</h2>
        <div>
          <button id="refresh-briefing-btn" class="btn-ghost">다시 생성</button>
          <button id="close-briefing-modal" class="btn-ghost">닫기</button>
        </div>
      </div>
      <div id="briefing-body">
        <p class="briefing-loading">브리핑을 준비하는 중…</p>
      </div>
    </div>
  </div>

  <div id="deliverable-modal" class="modal-backdrop hidden">
    <div class="modal modal-wide">
      <div class="modal-header">
        <h2 id="deliverable-title">AI 결과물</h2>
        <div>
          <button id="copy-deliverable-btn" class="btn-ghost">복사</button>
          <button id="complete-deliverable-btn" class="btn-ghost">완료로 이동</button>
          <button id="close-deliverable-modal" class="btn-ghost">닫기</button>
        </div>
      </div>
      <p id="deliverable-summary" class="deliverable-summary"></p>
      <pre id="deliverable-content" class="deliverable-box"></pre>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>
  <script src="/static/app.js"></script>
</body>
</html>
